name: macOS

on:
  push:
    branches: [main]
    tags: ['v*'] # los filtros de paths no se aplican a las etiquetas: cada v* publica Kaito-macOS.zip
    paths:
      - 'macos/**'
      - 'hooks/**'
      - 'VERSION'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'hooks/**'
      - 'VERSION'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: KaitoCore en Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: swift build
      - name: Tests
        run: swift test

  build-macos:
    name: Build y tests en macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Compilar (debug)
        run: swift build
      - name: Tests
        run: swift test
      - name: Kaito.app universal
        run: ./build-app.sh
      - name: Comprobar el bundle
        run: |
          plutil -lint build/Kaito.app/Contents/Info.plist
          lipo -archs build/Kaito.app/Contents/MacOS/Kaito
          codesign --verify --verbose build/Kaito.app
      - uses: actions/upload-artifact@v4
        with:
          name: Kaito-macOS
          path: macos/build/Kaito-macOS.zip
          retention-days: 14

  release:
    name: Publicar en la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-linux, build-macos]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: La etiqueta coincide con VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con VERSION ($v)"; exit 1; }
      - name: Kaito.app universal
        working-directory: macos
        run: ./build-app.sh
      - name: Subir Kaito-macOS.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" macos/build/Kaito-macOS.zip --clobber
          else
            # Notas: el mensaje de la etiqueta anotada; si es ligera, las generadas por GitHub.
            if [ "$(git cat-file -t "$tag" 2>/dev/null)" = tag ]; then notes=(--notes-from-tag); else notes=(--generate-notes); fi
            gh release create "$tag" macos/build/Kaito-macOS.zip --title "Kaito $tag" "${notes[@]}" --verify-tag
          fi
